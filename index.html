
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tacticut's Tetris</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#101522;color:#f3f6ff;font-family:Arial,"Microsoft YaHei",sans-serif;display:flex;justify-content:center;align-items:center;padding:20px}
.app{width:min(850px,100%)}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
h1{margin:0;font-size:32px;letter-spacing:2px}
button{border:1px solid #3a4963;background:#263249;color:white;padding:10px 14px;border-radius:10px;cursor:pointer}
button:hover{border-color:#70d6ff}
.layout{display:grid;grid-template-columns:minmax(260px,1fr) 210px;gap:18px}
.game-panel,.side-panel{background:#1b2435;border:1px solid #3a4963;border-radius:16px;padding:15px}
canvas{display:block;max-width:100%;height:auto}
#board{width:min(100%,300px);margin:auto;background:#0b101a;border:2px solid #53627d;border-radius:6px}
.side-panel{display:grid;gap:12px}
.stat{background:#111a29;border:1px solid #33435d;border-radius:12px;padding:12px}
.stat-label{color:#aab6ca;font-size:12px}
.stat-value{font-size:25px;font-weight:bold;margin-top:5px}
#next{width:144px;margin:8px auto 0;background:#0b101a;border-radius:8px}
.controls{font-size:13px;line-height:1.8;color:#aab6ca}
.controls strong{color:white}
.actions{display:flex;gap:8px}
.overlay{position:fixed;inset:0;background:#070b13cc;display:flex;justify-content:center;align-items:center;padding:20px}
.dialog{width:min(360px,100%);background:#1b2435;border:1px solid #3a4963;border-radius:18px;padding:25px;text-align:center}
.dialog h2{margin:0 0 10px;font-size:30px}
.dialog p{color:#aab6ca}
.hidden{display:none}
.mobile-controls{display:none;gap:8px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.mobile-controls button{min-width:55px;font-size:18px}
footer{text-align:center;color:#aab6ca;font-size:12px;margin-top:14px}
@media(max-width:650px){
 .layout{grid-template-columns:1fr}
 .side-panel{grid-template-columns:repeat(2,minmax(0,1fr))}
 .controls{grid-column:1/-1}
 .mobile-controls{display:flex}
}
</style>
</head>
<body>
<div class="app">
<header>
<h1 id="title">TETRIS</h1>
<div class="actions">
<button id="languageBtn">English</button>
<button id="restartBtn">重新开始</button>
</div>
</header>
<div class="layout">
<section class="game-panel">
<canvas id="board" width="300" height="600"></canvas>
<div class="mobile-controls">
<button data-action="left">◀</button>
<button data-action="rotate">↻</button>
<button data-action="right">▶</button>
<button data-action="down">▼</button>
</div>
</section>
<aside class="side-panel">
<div class="stat">
<div class="stat-label" id="scoreLabel">分数</div>
<div class="stat-value" id="score">0</div>
</div>
<div class="stat">
<div class="stat-label" id="linesLabel">消除行数</div>
<div class="stat-value" id="lines">0</div>
</div>
<div class="stat">
<div class="stat-label" id="levelLabel">等级</div>
<div class="stat-value" id="level">1</div>
</div>
<div class="stat">
<div class="stat-label" id="nextLabel">下一个方块</div>
<canvas id="next" width="144" height="112"></canvas>
</div>
<div class="stat controls" id="controls">
<strong>操作说明</strong><br>
A / ←：向左移动<br>
D / →：向右移动<br>
S / ↓：加速下落（长按）<br>
空格 / ↑：旋转方块<br>
R：重新开始
</div>
</aside>
</div>
<footer id="footer">Tacticut 的俄罗斯方块</footer>
</div>

<div class="overlay" id="overlay">
<div class="dialog">
<h2 id="overlayTitle">准备好了吗？</h2>
<p id="overlayText">按下开始，挑战你的最高分！</p>
<button id="startBtn">开始游戏</button>
</div>
</div>

<script>
"use strict";

const ROWS=20;
const COLS=10;
const CELL=30;

const SHAPES={
 I:[[1,1,1,1]],
 O:[[1,1],[1,1]],
 T:[[0,1,0],[1,1,1]],
 S:[[0,1,1],[1,1,0]],
 Z:[[1,1,0],[0,1,1]],
 J:[[1,0,0],[1,1,1]],
 L:[[0,0,1],[1,1,1]]
};

const COLORS={
 I:"#58d7e8",
 O:"#f5d65c",
 T:"#b58cff",
 S:"#75d681",
 Z:"#ff7777",
 J:"#6f9cff",
 L:"#ffad5c"
};

const boardCanvas=document.getElementById("board");
const ctx=boardCanvas.getContext("2d");
const nextCanvas=document.getElementById("next");
const nctx=nextCanvas.getContext("2d");

const $=id=>document.getElementById(id);

let board;
let piece;
let nextType;
let score=0;
let lines=0;
let level=1;
let gameOver=false;
let started=false;
let lastTime=0;
let dropCounter=0;
let softCounter=0;
let softDrop=false;
let lang="zh";

const words={
 zh:{
  restart:"重新开始",score:"分数",lines:"消除行数",
  level:"等级",next:"下一个方块",controls:"操作说明",
  left:"向左移动",right:"向右移动",
  down:"加速下落（长按）",rotate:"旋转方块",
  start:"开始游戏",ready:"准备好了吗？",
  readyText:"按下开始，挑战你的最高分！",
  over:"游戏结束",overText:"本局得分：",
  again:"再玩一次",footer:"Tacticut 的俄罗斯方块"
 },
 en:{
  restart:"Restart",score:"Score",lines:"Lines",
  level:"Level",next:"Next Piece",controls:"CONTROLS",
  left:"Move left",right:"Move right",
  down:"Soft drop (hold)",rotate:"Rotate",
  start:"Start Game",ready:"Ready?",
  readyText:"Press start and beat your high score!",
  over:"GAME OVER",overText:"Your score: ",
  again:"Play Again",footer:"Tacticut's Tetris"
 }
};

function randomType(){
 const keys=Object.keys(SHAPES);
 return keys[Math.floor(Math.random()*keys.length)];
}

function cloneShape(type){
 return SHAPES[type].map(row=>row.slice());
}

function resetGame(){
 board=Array.from(
  {length:ROWS},
  ()=>Array(COLS).fill("")
 );

 score=0;
 lines=0;
 level=1;
 gameOver=false;
 started=true;
 softDrop=false;

 nextType=randomType();
 spawnPiece();

 lastTime=0;
 dropCounter=0;
 softCounter=0;

 $("overlay").classList.add("hidden");
 updateStats();
 draw();
}

function spawnPiece(){
 const type=nextType;
 nextType=randomType();

 piece={
  type:type,
  shape:cloneShape(type),
  x:Math.floor(
   (COLS-SHAPES[type][0].length)/2
  ),
  y:0
 };

 drawNext();

 if(collides(piece.shape,piece.x,piece.y)){
  endGame();
 }
}

function collides(shape,x,y){
 for(let r=0;r<shape.length;r++){
  for(let c=0;c<shape[r].length;c++){
   if(!shape[r][c])continue;

   const nx=x+c;
   const ny=y+r;

   if(nx<0||nx>=COLS||ny>=ROWS){
    return true;
   }

   if(ny>=0&&board[ny][nx]){
    return true;
   }
  }
 }
 return false;
}

function move(dx){
 if(!started||gameOver)return;

 if(!collides(
  piece.shape,
  piece.x+dx,
  piece.y
 )){
  piece.x+=dx;
 }

 draw();
}

function rotate(){
 if(!started||gameOver)return;

 const h=piece.shape.length;
 const w=piece.shape[0].length;

 const rotated=Array.from(
  {length:w},
  ()=>Array(h).fill(0)
 );

 for(let r=0;r<h;r++){
  for(let c=0;c<w;c++){
   rotated[c][h-1-r]=piece.shape[r][c];
  }
 }

 if(!collides(rotated,piece.x,piece.y)){
  piece.shape=rotated;
 }else if(!collides(rotated,piece.x-1,piece.y)){
  piece.x--;
  piece.shape=rotated;
 }else if(!collides(rotated,piece.x+1,piece.y)){
  piece.x++;
  piece.shape=rotated;
 }

 draw();
}

function lockPiece(){
 for(let r=0;r<piece.shape.length;r++){
  for(let c=0;c<piece.shape[r].length;c++){
   if(piece.shape[r][c]){
    const y=piece.y+r;
    const x=piece.x+c;

    if(y>=0&&y<ROWS&&x>=0&&x<COLS){
     board[y][x]=piece.type;
    }
   }
  }
 }

 clearLines();

 if(!gameOver){
  spawnPiece();
 }
}

function clearLines(){
 let cleared=0;

 for(let r=ROWS-1;r>=0;r--){
  if(board[r].every(cell=>cell)){
   board.splice(r,1);
   board.unshift(Array(COLS).fill(""));
   cleared++;
   r++;
  }
 }

 if(cleared){
  const points=[0,100,300,500,800];

  score+=points[cleared]||cleared*200;
  lines+=cleared;
  level=Math.floor(lines/10)+1;

  updateStats();
 }
}

function stepDown(manual=false){
 if(!started||gameOver)return false;

 if(!collides(
  piece.shape,
  piece.x,
  piece.y+1
 )){
  piece.y++;

  if(manual){
   score++;
   updateStats();
  }

  return true;
 }

 lockPiece();
 return false;
}

function endGame(){
 gameOver=true;
 started=false;
 softDrop=false;

 $("overlayTitle").textContent=words[lang].over;
 $("overlayText").textContent=
  words[lang].overText+score;
 $("startBtn").textContent=words[lang].again;

 $("overlay").classList.remove("hidden");
}

function updateStats(){
 $("score").textContent=score;
 $("lines").textContent=lines;
 $("level").textContent=level;
}

function drawCell(context,x,y,color,size){
 context.fillStyle=color;
 context.fillRect(
  x*size+1,y*size+1,size-2,size-2
 );

 context.fillStyle="#ffffff30";
 context.fillRect(
  x*size+2,y*size+2,size-4,3
 );

 context.strokeStyle="#08111d88";
 context.strokeRect(
  x*size+1.5,y*size+1.5,size-3,size-3
 );
}

function draw(){
 ctx.clearRect(
  0,0,boardCanvas.width,boardCanvas.height
 );

 ctx.fillStyle="#0b101a";
 ctx.fillRect(
  0,0,boardCanvas.width,boardCanvas.height
 );

 for(let r=0;r<ROWS;r++){
  for(let c=0;c<COLS;c++){
   if(board[r][c]){
    drawCell(
     ctx,c,r,COLORS[board[r][c]],CELL
    );
   }else{
    ctx.strokeStyle="#ffffff0d";
    ctx.strokeRect(
     c*CELL,r*CELL,CELL,CELL
    );
   }
  }
 }

 if(piece){
  for(let r=0;r<piece.shape.length;r++){
   for(let c=0;c<piece.shape[r].length;c++){
    if(piece.shape[r][c]){
     drawCell(
      ctx,
      piece.x+c,
      piece.y+r,
      COLORS[piece.type],
      CELL
     );
    }
   }
  }
 }
}

function drawNext(){
 nctx.clearRect(
  0,0,nextCanvas.width,nextCanvas.height
 );

 nctx.fillStyle="#0b101a";
 nctx.fillRect(
  0,0,nextCanvas.width,nextCanvas.height
 );

 const shape=SHAPES[nextType];
 const size=24;

 const ox=(
  nextCanvas.width-shape[0].length*size
 )/2;

 const oy=(
  nextCanvas.height-shape.length*size
 )/2;

 for(let r=0;r<shape.length;r++){
  for(let c=0;c<shape[r].length;c++){
   if(shape[r][c]){
    nctx.fillStyle=COLORS[nextType];

    nctx.fillRect(
     ox+c*size+1,
     oy+r*size+1,
     size-2,
     size-2
    );

    nctx.fillStyle="#ffffff30";

    nctx.fillRect(
     ox+c*size+2,
     oy+r*size+2,
     size-4,
     3
    );
   }
  }
 }
}

function loop(time=0){
 if(!started)return;

 const delta=lastTime
  ?time-lastTime
  :0;

 lastTime=time;
 dropCounter+=delta;
 softCounter+=delta;

 const interval=Math.max(
  90,
  650-(level-1)*55
 );

 if(softDrop&&softCounter>=45){
  stepDown(true);
  softCounter=0;
 }else if(dropCounter>=interval){
  stepDown(false);
  dropCounter=0;
 }

 draw();

 if(started){
  requestAnimationFrame(loop);
 }
}

function start(){
 resetGame();
 requestAnimationFrame(loop);
}

function setLanguage(){
 const w=words[lang];

 document.documentElement.lang=
  lang==="zh"?"zh-CN":"en";

 $("languageBtn").textContent=
  lang==="zh"?"English":"简体中文";

 $("restartBtn").textContent=w.restart;
 $("scoreLabel").textContent=w.score;
 $("linesLabel").textContent=w.lines;
 $("levelLabel").textContent=w.level;
 $("nextLabel").textContent=w.next;

 $("controls").innerHTML=
  `<strong>${w.controls}</strong><br>
  A / ←: ${w.left}<br>
  D / →: ${w.right}<br>
  S / ↓: ${w.down}<br>
  SPACE / ↑: ${w.rotate}<br>
  R: ${w.restart}`;

 $("footer").textContent=w.footer;

 if(!started&&!gameOver){
  $("overlayTitle").textContent=w.ready;
  $("overlayText").textContent=w.readyText;
  $("startBtn").textContent=w.start;
 }

 if(gameOver){
  $("overlayTitle").textContent=w.over;
  $("overlayText").textContent=
   w.overText+score;
  $("startBtn").textContent=w.again;
 }
}

function handleKey(e){
 const k=e.key.toLowerCase();

 if([
  "arrowleft","arrowright",
  "arrowdown","arrowup"," "
 ].includes(k)){
  e.preventDefault();
 }

 if(k==="r"){
  start();
  return;
 }

 if(!started||gameOver)return;

 if(k==="a"||k==="arrowleft"){
  move(-1);
 }else if(k==="d"||k==="arrowright"){
  move(1);
 }else if(k===" "||k==="arrowup"){
  if(!e.repeat)rotate();
 }else if(k==="s"||k==="arrowdown"){
  softDrop=true;
 }
}

function releaseKey(e){
 const k=e.key.toLowerCase();

 if(k==="s"||k==="arrowdown"){
  softDrop=false;
  softCounter=0;
 }
}

document.addEventListener(
 "keydown",handleKey
);

document.addEventListener(
 "keyup",releaseKey
);

$("startBtn").addEventListener(
 "click",start
);

$("restartBtn").addEventListener(
 "click",start
);

$("languageBtn").addEventListener(
 "click",()=>{
  lang=lang==="zh"?"en":"zh";
  setLanguage();
 }
);

document.querySelectorAll(
 "[data-action]"
).forEach(btn=>{
 const action=btn.dataset.action;

 btn.addEventListener("click",()=>{
  if(action==="left")move(-1);
  if(action==="right")move(1);
  if(action==="rotate")rotate();
  if(action==="down")stepDown(true);
 });
});

board=Array.from(
 {length:ROWS},
 ()=>Array(COLS).fill("")
);

piece=null;
nextType=randomType();

drawNext();
draw();
setLanguage();
</script>
</body>
</html>
